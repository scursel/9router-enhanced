name: Secret scan

# Server-side backstop for scripts/check-no-secrets.mjs: the local pre-commit
# hook can be missing (fresh clone, --no-verify, web UI commits).
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Scan added content
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            BASE=$(git merge-base "$PR_BASE" HEAD)
          elif [ -n "$PUSH_BEFORE" ] && ! echo "$PUSH_BEFORE" | grep -q '^0*$' && git cat-file -e "$PUSH_BEFORE^{commit}" 2>/dev/null; then
            BASE="$PUSH_BEFORE"
          else
            # new branch / force-push to unknown base: fall back to the default branch
            BASE=$(git merge-base "origin/${{ github.event.repository.default_branch }}" HEAD)
          fi
          node scripts/check-no-secrets.mjs --range "$BASE..HEAD"
