name: Build and Push Docker Image

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  GHCR_IMAGE: ghcr.io/${{ github.repository }}
  DOCKERHUB_IMAGE: decolua/9router

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      # Secret values cannot be trusted in `if:` expressions (workflow/env
      # secret mapping is invisible to `if` evaluation), so presence is
      # detected in a real step and gated through its output: a fork without
      # DOCKERHUB_USERNAME/TOKEN publishes GHCR only instead of dying at login
      # (the .4/.5/.6 tag builds all died in ~15s this way). Repos that DO
      # define the secrets keep the exact previous behavior — both registries.
      - name: Detect Docker Hub credentials
        id: detect
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          if [ -n "$DOCKERHUB_USERNAME" ]; then
            echo "dh=true" >> "$GITHUB_OUTPUT"
          else
            echo "dh=false" >> "$GITHUB_OUTPUT"
            echo "Docker Hub secrets absent — publishing GHCR only."
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: steps.detect.outputs.dh == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # metadata-action cannot conditionally include an image, so the image
      # list is resolved here: Docker Hub joins only when its login can succeed.
      - name: Resolve publish targets
        id: targets
        run: |
          if [ "${{ steps.detect.outputs.dh }}" = "true" ]; then
            printf 'images=%s\n%s\n' "$GHCR_IMAGE" "$DOCKERHUB_IMAGE" >> "$GITHUB_OUTPUT"
          else
            printf 'images=%s\n' "$GHCR_IMAGE" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.targets.outputs.images }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.GHCR_IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.GHCR_IMAGE }}:buildcache,mode=max
          platforms: linux/amd64,linux/arm64
          provenance: false
          sbom: false
